<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - FriendChat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <img id="myAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="avatar">
                    <span id="myName">Loading...</span>
                </div>
                <div class="sidebar-actions">
                    <button class="icon-btn" id="searchBtn" title="Search Users"><i class="fas fa-search"></i></button>
                    <button class="icon-btn" id="notifBtn" title="Notifications"><i class="fas fa-bell"></i></button>
                    <button class="icon-btn" id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="search-container">
                <div class="search-bar">
                    <i class="fas fa-search" style="color: #8696a0;"></i>
                    <input type="text" placeholder="Search or start new chat">
                </div>
            </div>
            <div class="friend-list" id="friendList">
                <!-- Friends will be loaded here -->
            </div>
        </div>
        <div class="chat-area" id="welcomeScreen">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary);">
                <i class="fas fa-comments" style="font-size: 5rem; margin-bottom: 1rem;"></i>
                <h2>Welcome to FriendChat</h2>
                <p>Select a friend to start chatting</p>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="searchModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3>Search Users</h3>
                <span id="closeModal" style="cursor: pointer; font-size: 1.5rem;">&times;</span>
            </div>
            <div class="search-bar">
                <input type="text" id="userSearchInput" placeholder="Type a name...">
            </div>
            <div class="search-results" id="searchResults">
                <!-- Search results here -->
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/home.js"></script>
</body>
</html>
